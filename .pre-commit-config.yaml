# Opcional (DTEC 017): a integração contínua é a verificação obrigatória.
# Instalação: `uvx pre-commit install` na raiz do repositório.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--config, backend/pyproject.toml]
        files: ^backend/
      - id: ruff-format
        args: [--config, backend/pyproject.toml]
        files: ^backend/
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: npm --prefix frontend exec -- prettier --check --ignore-unknown
        files: ^frontend/
        pass_filenames: false
      - id: eslint
        name: eslint
        language: system
        entry: npm --prefix frontend run lint
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
