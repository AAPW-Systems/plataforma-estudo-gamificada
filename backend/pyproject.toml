[project]
name = "plataforma-backend"
version = "0.1.0"
description = "API da plataforma de estudos gamificada (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "email-validator==2.3.0",
    "fastapi==0.143.0",
    "fsrs==6.3.2",
    "procrastinate==3.10.0",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-ai-slim[google,groq]==2.63.0",
    "pydantic-settings==2.15.0",
    "pymupdf==1.28.2",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.1.4",
    "structlog==26.1.0",
    "tzdata==2026.5",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "hypothesis==6.169.0",
    "mypy==2.4.0",
    "openapi-spec-validator==0.9.0",
    "pydantic-evals==2.63.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "migracoes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# assert e valores fixos fictícios são esperados nos testes
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
files = ["src", "tests", "migracoes"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["procrastinate.*", "fsrs.*"]
follow_untyped_imports = true

# O PyMuPDF é só parcialmente tipado (chamadas sem tipo, constantes ausentes): tratado como Any.
# Os módulos que o usam ficam pequenos e com tipos próprios nas fronteiras (fontes/extracao.py).
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not avaliacao_ia"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: regras e invariantes isoladas, sem banco nem HTTP",
    "integration: interação entre camadas e serviços reais (banco, fila, armazenamento)",
    "functional: critérios de aceitação das histórias, de ponta a ponta pela API",
    "security: autenticação, autorização, isolamento, validação e vazamento de dados",
    "adversarial: entradas maliciosas ou inesperadas, reenvios e concorrência",
    "avaliacao_ia: conjunto de avaliação com o provedor real (DTEC 011 e 047), fora do merge",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true
# O SQLAlchemy assíncrono troca de greenlet a cada acesso ao banco; sem isto o coverage perde as
# linhas executadas depois da primeira troca (servicos.py aparecia com 74% em vez de 95%).
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
