# Ambiente local completo (regra 11): `docker compose up --build`.
# Serviços e ordem de subida: plano da 001, "Contêineres (MVP)".
name: plataforma-estudo

x-backend: &backend
  build:
    context: ./backend
    target: dev
  image: plataforma-api:dev
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
  volumes:
    - ./backend:/app
    - /app/.venv
    - arquivos:/dados/arquivos
  networks: [interna]

services:
  db:
    image: pgvector/pgvector:pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    # Sem porta publicada: o banco só é acessível na rede interna do Compose.
    # Acesso manual: docker compose exec db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB".
    volumes:
      - banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [interna]

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2).status != 200)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      target: dev
    image: plataforma-web:dev
    environment:
      VITE_DESTINO_API: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # O gerar:api lê ../backend/openapi.json (fonte dos tipos do frontend).
      - ./backend:/backend:ro
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      interna:
        # Endereço fixo: só o proxy do Vite tem o X-Forwarded-For aceito pela API (PROXIES_CONFIAVEIS).
        ipv4_address: 172.28.0.10

networks:
  interna:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  banco:
  arquivos:
