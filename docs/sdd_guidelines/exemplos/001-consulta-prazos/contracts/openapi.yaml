openapi: 3.1.0
info:
  title: API de consulta de prazos acadêmicos
  version: 0.1.0
paths:
  /api/v1/queries:
    post:
      summary: Consulta o corpus acadêmico aprovado
      operationId: createQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Consulta processada com um estado do domínio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '422':
          description: Entrada fora do contrato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '503':
          description: API incapaz de processar a requisição
  /health:
    get:
      summary: Verifica processo e persistência
      operationId: getHealth
      responses:
        '200':
          description: Serviço disponível
        '503':
          description: Serviço indisponível
components:
  schemas:
    QueryRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 500
    QueryResponse:
      type: object
      additionalProperties: false
      required: [query_id, status, message, citations, corpus_version]
      properties:
        query_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - answered
            - insufficient_evidence
            - needs_clarification
            - source_conflict
            - unavailable
        message:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        corpus_version:
          type: string
    Citation:
      type: object
      additionalProperties: false
      required: [document_id, title, version, section]
      properties:
        document_id:
          type: string
        title:
          type: string
        version:
          type: string
        section:
          type: string
    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
